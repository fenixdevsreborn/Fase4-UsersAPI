name: Deploy Users API

on:
  push:
    branches:
      - main
      - soares/usersapi

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore users-api/src/UsersAPI/UsersAPI.csproj

    - name: Build
      run: dotnet build users-api/src/UsersAPI/UsersAPI.csproj --no-restore

    - name: Publish
      run: dotnet publish users-api/src/UsersAPI/UsersAPI.csproj -c Release -o publish

    - name: DockerHub Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set image tag
      run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/users-api:${TAG} .
        ./users-api

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/users-api:${TAG}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --name ${{ secrets.EKS_CLUSTER_NAME }} \
          --region ${{ secrets.AWS_REGION }}

    - name: Update deployment image
      run: |
        kubectl set image deployment/users-api \
          users-api=${{ secrets.DOCKER_USERNAME }}/users-api:${TAG}

    - name: Wait rollout
      run: |
        kubectl rollout status deployment/users-api